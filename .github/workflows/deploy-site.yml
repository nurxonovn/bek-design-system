# Hujjat saytini (apps/site) GitHub Pages'ga joylash.
# Repo Settings → Pages → Source: "GitHub Actions" bo'lishi kerak. main'ga push yoki qo'lda (istalgan branch).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sayt bog'liq bo'lgan hamma paketlar (tokens, react, charts, backgrounds …) — topologik tartibda.
      - run: pnpm --filter "@bek-ui/site^..." build
      - run: pnpm --filter @bek-ui/site build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: cp apps/site/dist/index.html apps/site/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
